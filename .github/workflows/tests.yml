# A3-b — the gate that did not exist.
#
# Until this file, the ONLY thing running on push was docker-build.yml, which
# builds the API image and boots it. It runs no tests and no lint. frontend had
# no `test` script at all, and `next build` skipped linting entirely because
# there was no eslint config until A3. So 80 tests protected only the sessions
# where someone remembered to run them by hand.
#
# The guard audit runs here too, deliberately. A suite being green proves the
# code is clean OR that the guards cannot detect anything, and those look
# identical from the outside.

name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        working-directory: backend
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      # Not `npx jest --ci`: exit 0 is also what jest returns when it ran
      # NOTHING. The floor asserts a positive executed count.
      - name: Test
        run: node tools/run-suite.js backend 317

      # A guard that exists and is not invoked is indistinguishable from no
      # guard, and the suite passes either way because it tests the function
      # and not the path. Three shipped that way before this check existed.
      - name: Every guard has a live caller
        run: node tools/guard-wiring.js --strict

      # The same shape pointed the other way: a caller whose target is gone.
      # "Download PDF" pointed at a route deleted months earlier and 404'd
      # silently, because no suite on either side of the wire sees both.
      - name: Every frontend /api call has a route behind it
        run: node tools/check-frontend-endpoints.js

      # A write that cannot satisfy a live constraint is not a latent bug: it
      # is a guaranteed 500 behind whichever control calls it. Two shipped that
      # way, both found by sweeping rather than by clicking.
      - name: Every write can satisfy the live constraints
        run: node tools/check-write-paths.js

      # And the endpoint tests must be able to TELL. Each one is re-run with
      # its guard's call removed; a test that stays green proves only that the
      # endpoint responds.
      - name: Endpoint guard tests go red when the guard is unwired
        run: node tools/prove-endpoint-guards-red.js

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Lint
        working-directory: frontend
        run: npx next lint --dir pages --dir components --dir lib
      - name: Test
        run: node tools/run-suite.js frontend 216

      # No mutation marker or audit artifact may reach a commit. Journalling,
      # self-heal and the dirty-tree check all run on a developer's machine and
      # a hard kill at the wrong moment skips every one of them. This does not
      # run there, so nothing can skip it.
      - name: No mutation artifact reached this commit
        run: node tools/check-no-mutation-artifacts.js

      # Mutates a file, runs one guard, requires it to go RED, reverts. Fails
      # the build if any guard cannot detect its own violation.
      - name: Prove every guard red on a violating input
        working-directory: frontend
        run: node scripts/prove-guards-red.js

      - name: Confirm the working tree is clean after the audit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The guard audit did not revert every mutation:"
            git status --porcelain
            git diff
            exit 1
          fi
