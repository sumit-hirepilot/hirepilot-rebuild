                            <title>Principal Partner Value Engineer</title>
            <meta property="og:title" content="Principal Partner Value Engineer"/>
                            <meta name="description" content="Elastic, the Search AI Company, enables everyone to find the answers they need in real time, using all their data, at scale — unleashing the potential of businesses and people. The Elastic Search AI Platform, used by more than 50% of the Fortune 500, brings together the precision of search and the intelligence of AI to enable everyone to accelerate the results that matter. By taking advantage of all structured and unstructured data — securing and protecting private information more effectively — Elastic’s complete, cloud-based solutions for search, security, and observability help organizations deliver on the promise of AI.What is The Role:Elastic is seeking a Principal Partner Value Engineer to drive the economic blueprint of our strategic ecosystem. In this role, you will sit at the critical intersection of Elastic, our strategic Partners, and the ultimate End Customer. Your mission is two-fold: articulate and maximize Elastic’s value proposition to our partners, and co-create the partners&#039; unified value proposition to the market.We are looking for a high-impact professional with a deep background in partner ecosystems, a proven track record of value-based selling, and established partner relationships. This is a fully remote role open to candidates based in AMER. If you excel in dynamic environments, love building scalable frameworks, and are ready to be a change agent within a high-performing global team, we want to hear from you.What You Will Be Doing:Dual-Value Architecture: Co-develop and articulate the joint &quot;Elastic + Partner&quot; value proposition. Help partners understand the ROI of building on or with Elastic, while simultaneously helping partners position that combined value to their end customers.Ecosystem Collaboration: Partner closely with Global Alliances, Channel Sales leaders, and partner account teams to identify, prioritize, and execute value delivery strategies for key regional and global partners.Business Case and ROI Development: Lead joint business value reviews and create boardroom-quality business cases that quantify the economic benefits, total cost of ownership (TCO), and realized business impacts of Elastic-powered partner solutions.Framework and Tool Creation: Help scale the Partner Value Engineering practice by creating repeatable frameworks, tools, and value calculators tailored specifically to different partner personas such as GSIs, MSSPs, and Cloud Hyperscalers.Executive Presentation: Deliver compelling, high-impact presentations to partner executives and joint customers, acting as a trusted advisor on business transformation and optimization.Cross-Functional Alignment: Work collaboratively with Product, Marketing, and Engineering teams to ensure partner feedback and unique ecosystem use cases are integrated into Elastic’s broader value strategy.Enablement and Workshops: Conduct training sessions and workshops for both internal Elastic teams and partner organizations to elevate their discovery capabilities and understanding of value-based selling.What You Bring:Experience: 4+ years of experience in Value Engineering, Management Consulting, Partner Enablement, or a related customer or partner-facing strategic role.Partner DNA: Proven experience working directly within or alongside partner ecosystems (GSIs, RSIs, MSPs, or Cloud Providers) with a strong network of existing partner relationships.Value Selling Expertise: Expert-level knowledge of value-based selling methodologies (such as MEDDPICC, Challenger, or similar frameworks) and a demonstrated ability to build complex financial models and business cases.Strategic and Analytical Skills: Strong analytical, financial acumen, and problem-solving skills. Ability to navigate ambiguity, project manage multiple workstreams, and act decisively under minimal supervision.Communication Mastery: Exceptional communication and storytelling skills, with a track record of influencing C-level executives and partner principals.Location and Travel: Remote, based in North America. Willingness to travel as needed to meet with partners and account teams within your region.Additional Information - We Take Care of Our People:As a distributed company, diversity drives our identity. Whether you’re looking to launch a new career or grow an existing one, Elastic is the type of company where you can balance great work with great life. Your age is only a number. It doesn’t matter if you’re just out of college or your children are; we need you for what you can do.We strive to have parity of benefits across regions, and while regulations differ from place to place, we believe taking care of our people is the right thing to do.Competitive pay based on the work you do here and not your previous salaryHealth coverage for you and your family in many locationsAbility to craft your calendar with flexible locations and schedules for many rolesGenerous number of vacation days each yearIncrease your impact - We match up to $2000 (or local currency equivalent) for financial donations and serviceUp to 40 hours each year to use toward volunteer projects you loveEmbracing parenthood with a minimum of 16 weeks of parental leaveDifferent people approach problems differently. We need that. Elastic is an equal opportunity employer and is committed to creating an inclusive culture that celebrates different perspectives, experiences, and backgrounds. Qualified applicants will receive consideration for employment without regard to race, ethnicity, color, religion, sex, pregnancy, sexual orientation, gender perception or identity, national origin, age, marital status, protected veteran status, disability status, or any other basis protected by federal, state or local law, ordinance or regulation.We welcome individuals with disabilities and strive to create an accessible and inclusive experience for all individuals. To request an accommodation during the application or the recruiting process, please email candidate_accessibility@elastic.co. We will reply to your request within 24 business hours of submission.Applicants have rights under Federal Employment Laws and can view the following posters linked below:Family and Medical Leave Act (FMLA) PosterEmployee Polygraph Protection Act (EPPA) PosterElasticsearch develops and distributes technology and information that is subject to U.S. and other countries’ export controls and licensing requirements for individuals who are located in or are nationals of the following sanctioned countries and regions: Belarus, Cuba, Iran, North Korea, Syria, or Russia, including the Ukrainian territories annexed by Russia (The Crimea region of Ukraine, The Donetsk People&#039;s Republic (DNR), The Luhansk People&#039;s Republic (LNR), Kherson or Zaporizhzhia). If you are located in or are a national of one of the listed countries or regions, an export license may be required as a condition of your employment in this role. Please note that national origin and/or nationality do not affect eligibility for employment with Elastic.Please see here for our Privacy Statement.Compensation for this role is in the form of base salary plus a variable component, that together comprise the On-Target Earnings (OTE). On-Target Earnings (OTE) are based on a 75/25 pay mix (base salary / target variable).The typical starting OTE range for new hires in this role is listed below. This range represents the lowest to highest OTE we reasonably and in good faith believe we would pay for this role at the time of this posting. We may ultimately pay more or less than the posted range, and the range may be modified in the future.An employee&#039;s position within the OTE range will be based on several factors including, but not limited to, relevant education, qualifications, certifications, experience, skills, geographic location, performance, and business or organizational needs.Elastic believes that employees should have the opportunity to share in the value that we create together for our shareholders. Therefore, in addition to cash compensation, this role is currently eligible to participate in Elastic&#039;s stock program. Our total rewards package also includes a company-matched 401k with dollar-for-dollar matching up to 6% of eligible earnings, along with a range of other benefits offered with a holistic emphasis on employee well-being.The typical starting salary range for this role is:$138,200—$218,600 USDThe typical starting Target Variable range for this role is:$46,000—$72,800 USDThe typical starting On-Target Earnings (OTE) range for this role is:$184,200—$291,400 USD"/>

            <div id="app" data-page="{&quot;component&quot;:&quot;Elastic\/JobDetails&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;auth&quot;:{&quot;user&quot;:null},&quot;tenantConfig&quot;:{&quot;analytics&quot;:{&quot;ga_tracking_id&quot;:&quot;G-6JP3964S7C&quot;,&quot;gtm_id&quot;:null,&quot;mixpanel_token&quot;:&quot;811f6b44959762ffa5084464744d8e3d&quot;},&quot;branding&quot;:{&quot;customer_name&quot;:&quot;Elastic&quot;,&quot;app_name&quot;:&quot;Laravel&quot;},&quot;integrations&quot;:{&quot;filestack_api_key&quot;:null,&quot;bearer_token&quot;:null,&quot;search_url&quot;:null}},&quot;id&quot;:&quot;sa\/united-states\/principal-partner-value-engineer\/8111876&quot;,&quot;job_object&quot;:{&quot;id&quot;:3818320,&quot;uid&quot;:0,&quot;group_id&quot;:1509,&quot;date&quot;:&quot;2026-08-08 00:09:22&quot;,&quot;title&quot;:&quot;Principal Partner Value Engineer&quot;,&quot;content&quot;:&quot;&lt;p&gt;Elastic, the Search AI Company, enables everyone to find the answers they need in real time, using all their data, at scale \u2014 unleashing the potential of businesses and people. The Elastic Search AI Platform, used by more than 50% of the Fortune 500, brings together the precision of search and the intelligence of AI to enable everyone to accelerate the results that matter. By taking advantage of all structured and unstructured data \u2014 securing and protecting private information more effectively \u2014 Elastic\u2019s complete, cloud-based solutions for search, security, and observability help organizations deliver on the promise of AI.&lt;\/p&gt;&lt;h4&gt;What is The Role:&lt;\/h4&gt;&lt;p&gt;Elastic is seeking a &lt;b&gt;Principal Partner Value Engineer&lt;\/b&gt; to drive the economic blueprint of our strategic ecosystem. In this role, you will sit at the critical intersection of Elastic, our strategic Partners, and the ultimate End Customer. Your mission is two-fold: articulate and maximize &lt;b&gt;Elastic\u2019s value proposition to our partners&lt;\/b&gt;, and co-create the &lt;b&gt;partners&#039; unified value proposition to the market&lt;\/b&gt;.&lt;\/p&gt;&lt;p&gt;We are looking for a high-impact professional with a deep background in partner ecosystems, a proven track record of value-based selling, and established partner relationships. This is a &lt;b&gt;fully remote role&lt;\/b&gt; open to candidates based in &lt;b&gt;AMER&lt;\/b&gt;. If you excel in dynamic environments, love building scalable frameworks, and are ready to be a change agent within a high-performing global team, we want to hear from you.&lt;\/p&gt;&lt;h4&gt;What You Will Be Doing:&lt;\/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Dual-Value Architecture:&lt;\/b&gt; Co-develop and articulate the joint \&quot;Elastic + Partner\&quot; value proposition. Help partners understand the ROI of building on or with Elastic, while simultaneously helping partners position that combined value to their end customers.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Ecosystem Collaboration:&lt;\/b&gt; Partner closely with Global Alliances, Channel Sales leaders, and partner account teams to identify, prioritize, and execute value delivery strategies for key regional and global partners.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Business Case and ROI Development:&lt;\/b&gt; Lead joint business value reviews and create boardroom-quality business cases that quantify the economic benefits, total cost of ownership (TCO), and realized business impacts of Elastic-powered partner solutions.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Framework and Tool Creation:&lt;\/b&gt; Help scale the Partner Value Engineering practice by creating repeatable frameworks, tools, and value calculators tailored specifically to different partner personas such as GSIs, MSSPs, and Cloud Hyperscalers.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Executive Presentation:&lt;\/b&gt; Deliver compelling, high-impact presentations to partner executives and joint customers, acting as a trusted advisor on business transformation and optimization.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Cross-Functional Alignment:&lt;\/b&gt; Work collaboratively with Product, Marketing, and Engineering teams to ensure partner feedback and unique ecosystem use cases are integrated into Elastic\u2019s broader value strategy.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Enablement and Workshops:&lt;\/b&gt; Conduct training sessions and workshops for both internal Elastic teams and partner organizations to elevate their discovery capabilities and understanding of value-based selling.&lt;\/li&gt;&lt;\/ul&gt;&lt;h4&gt;What You Bring:&lt;\/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Experience:&lt;\/b&gt; 4+ years of experience in Value Engineering, Management Consulting, Partner Enablement, or a related customer or partner-facing strategic role.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Partner DNA:&lt;\/b&gt; Proven experience working directly within or alongside &lt;b&gt;partner ecosystems&lt;\/b&gt; (GSIs, RSIs, MSPs, or Cloud Providers) with a strong network of existing partner relationships.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Value Selling Expertise:&lt;\/b&gt; Expert-level knowledge of value-based selling methodologies (such as MEDDPICC, Challenger, or similar frameworks) and a demonstrated ability to build complex financial models and business cases.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Strategic and Analytical Skills:&lt;\/b&gt; Strong analytical, financial acumen, and problem-solving skills. Ability to navigate ambiguity, project manage multiple workstreams, and act decisively under minimal supervision.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Communication Mastery:&lt;\/b&gt; Exceptional communication and storytelling skills, with a track record of influencing C-level executives and partner principals.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Location and Travel:&lt;\/b&gt; Remote, based in &lt;b&gt;North America&lt;\/b&gt;. Willingness to travel as needed to meet with partners and account teams within your region.&lt;\/li&gt;&lt;\/ul&gt;&lt;h4&gt;Additional Information - We Take Care of Our People:&lt;\/h4&gt;&lt;p&gt;As a distributed company, diversity drives our identity. Whether you\u2019re looking to launch a new career or grow an existing one, Elastic is the type of company where you can balance great work with great life. Your age is only a number. It doesn\u2019t matter if you\u2019re just out of college or your children are; we need you for what you can do.&lt;\/p&gt;&lt;p&gt;We strive to have parity of benefits across regions, and while regulations differ from place to place, we believe taking care of our people is the right thing to do.&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;Competitive pay based on the work you do here and not your previous salary&lt;\/li&gt;&lt;li&gt;Health coverage for you and your family in many locations&lt;\/li&gt;&lt;li&gt;Ability to craft your calendar with flexible locations and schedules for many roles&lt;\/li&gt;&lt;li&gt;Generous number of vacation days each year&lt;\/li&gt;&lt;li&gt;Increase your impact - We match up to $2000 (or local currency equivalent) for financial donations and service&lt;\/li&gt;&lt;li&gt;Up to 40 hours each year to use toward volunteer projects you love&lt;\/li&gt;&lt;li&gt;Embracing parenthood with a minimum of 16 weeks of parental leave&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;Different people approach problems differently. We need that. Elastic is an equal opportunity employer and is committed to creating an inclusive culture that celebrates different perspectives, experiences, and backgrounds. Qualified applicants will receive consideration for employment without regard to race, ethnicity, color, religion, sex, pregnancy, sexual orientation, gender perception or identity, national origin, age, marital status, protected veteran status, disability status, or any other basis protected by federal, state or local law, ordinance or regulation.&lt;\/p&gt;&lt;p&gt;We welcome individuals with disabilities and strive to create an accessible and inclusive experience for all individuals. To request an accommodation during the application or the recruiting process, please email &lt;a href=\&quot;mailto:candidate_accessibility@elastic.co\&quot;&gt;candidate_accessibility@elastic.co&lt;\/a&gt;. We will reply to your request within 24 business hours of submission.&lt;\/p&gt;&lt;p&gt;Applicants have rights under Federal Employment Laws and can view the following posters linked below:&lt;\/p&gt;&lt;p&gt;&lt;a href=\&quot;https:\/\/www.dol.gov\/sites\/dolgov\/files\/WHD\/legacy\/files\/fmlaen.pdf\&quot;&gt;Family and Medical Leave Act (FMLA) Poster&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;a href=\&quot;https:\/\/www.dol.gov\/sites\/dolgov\/files\/WHD\/legacy\/files\/eppabw.pdf\&quot;&gt;Employee Polygraph Protection Act (EPPA) Poster&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;Elasticsearch develops and distributes technology and information that is subject to U.S. and other countries\u2019 export controls and licensing requirements for individuals who are located in or are nationals of the following sanctioned countries and regions: Belarus, Cuba, Iran, North Korea, Syria, or Russia, including the Ukrainian territories annexed by Russia (The Crimea region of Ukraine, The Donetsk People&#039;s Republic (DNR), The Luhansk People&#039;s Republic (LNR), Kherson or Zaporizhzhia). If you are located in or are a national of one of the listed countries or regions, an export license may be required as a condition of your employment in this role. Please note that national origin and\/or nationality do not affect eligibility for employment with Elastic.&lt;\/p&gt;&lt;p&gt;Please see &lt;a href=\&quot;https:\/\/www.elastic.co\/legal\/applicant-privacy-statement\&quot;&gt;here&lt;\/a&gt; for our Privacy Statement.&lt;\/p&gt;&lt;p&gt;Compensation for this role is in the form of base salary plus a variable component, that together comprise the On-Target Earnings (OTE). On-Target Earnings (OTE) are based on a 75\/25 pay mix (base salary \/ target variable).&lt;\/p&gt;&lt;p&gt;The typical starting OTE range for new hires in this role is listed below. This range represents the lowest to highest OTE we reasonably and in good faith believe we would pay for this role at the time of this posting. We may ultimately pay more or less than the posted range, and the range may be modified in the future.&lt;\/p&gt;&lt;p&gt;An employee&#039;s position within the OTE range will be based on several factors including, but not limited to, relevant education, qualifications, certifications, experience, skills, geographic location, performance, and business or organizational needs.&lt;\/p&gt;&lt;p&gt;Elastic believes that employees should have the opportunity to share in the value that we create together for our shareholders. Therefore, in addition to cash compensation, this role is currently eligible to participate in Elastic&#039;s stock program. Our total rewards package also includes a company-matched 401k with dollar-for-dollar matching up to 6% of eligible earnings, along with a range of other benefits offered with a holistic emphasis on employee well-being.&lt;\/p&gt;&lt;p&gt;The typical starting salary range for this role is:&lt;\/p&gt;&lt;p&gt;$138,200\u2014$218,600 USD&lt;\/p&gt;&lt;p&gt;The typical starting Target Variable range for this role is:&lt;\/p&gt;&lt;p&gt;$46,000\u2014$72,800 USD&lt;\/p&gt;&lt;p&gt;The typical starting On-Target Earnings (OTE) range for this role is:&lt;\/p&gt;&lt;p&gt;$184,200\u2014$291,400 USD&lt;\/p&gt;&quot;,&quot;enhanced_content&quot;:null,&quot;enhanced_requirements&quot;:null,&quot;url&quot;:&quot;sa\/united-states\/principal-partner-value-engineer\/8111876&quot;,&quot;owner&quot;:0,&quot;application&quot;:&quot;https:\/\/jobs.elastic.co\/jobs?gh_jid=8111876&amp;gh_jid=8111876&quot;,&quot;alt_apply&quot;:null,&quot;salary&quot;:null,&quot;address&quot;:&quot;United States&quot;,&quot;unique_identifier&quot;:&quot;8111876&quot;,&quot;category&quot;:&quot;SA&quot;,&quot;subdivision&quot;:&quot;Field Operations&quot;,&quot;bitly_url&quot;:null,&quot;jobvite_id&quot;: li&gt;&lt;b&gt;Framework and Tool Creation:&lt;\/b&gt; Help scale the Partner Value Engineering practice by creating repeatable frameworks, tools, and value calculators tailored specifically to different partner personas such as GSIs, MSSPs, and Cloud Hyperscalers.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Executive Presentation:&lt;\/b&gt; Deliver compelling, high-impact presentations to partner executives and joint customers, acting as a trusted advisor on business transformation and optimization.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Cross-Functional Alignment:&lt;\/b&gt; Work collaboratively with Product, Marketing, and Engineering teams to ensure partner feedback and unique ecosystem use cases are integrated into Elastic\u2019s broader value strategy.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Enablement and Workshops:&lt;\/b&gt; Conduct training sessions and workshops for both internal Elastic teams and partner organizations to elevate their discovery capabilities and understanding of value-based selling.&lt;\/li&gt;&lt;\/ul&gt;&lt;h4&gt;What You Bring:&lt;\/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Experience:&lt;\/b&gt; 4+ years of experience in Value Engineering, Management Consulting, Partner Enablement, or a related customer or partner-facing strategic role.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Partner DNA:&lt;\/b&gt; Proven experience working directly within or alongside &lt;b&gt;partner ecosystems&lt;\/b&gt; (GSIs, RSIs, MSPs, or Cloud Providers) with a strong network of existing partner relationships.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Value Selling Expertise:&lt;\/b&gt; Expert-level knowledge of value-based selling methodologies (such as MEDDPICC, Challenger, or similar frameworks) and a demonstrated ability to build complex financial models and business cases.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Strategic and Analytical Skills:&lt;\/b&gt; Strong analytical, financial acumen, and problem-solving skills. Ability to navigate ambiguity, project manage multiple workstreams, and act decisively under minimal supervision.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Communication Mastery:&lt;\/b&gt; Exceptional communication and storytelling skills, with a track record of influencing C-level executives and partner principals.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Location and Travel:&lt;\/b&gt; Remote, based in &lt;b&gt;North America&lt;\/b&gt;. Willingness to travel as needed to meet with partners and account teams within your region.&lt;\/li&gt;&lt;\/ul&gt;&lt;h4&gt;Additional Information - We Take Care of Our People:&lt;\/h4&gt;&lt;p&gt;As a distributed company, diversity drives our identity. Whether you\u2019re looking to launch a new career or grow an existing one, Elastic is the type of company where you can balance great work with great life. Your age is only a number. It doesn\u2019t matter if you\u2019re just out of college or your children are; we need you for what you can do.&lt;\/p&gt;&lt;p&gt;We strive to have parity of benefits across regions, and while regulations differ from place to place, we believe taking care of our people is the right thing to do.&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;Competitive pay based on the work you do here and not your previous salary&lt;\/li&gt;&lt;li&gt;Health coverage for you and your family in many locations&lt;\/li&gt;&lt;li&gt;Ability to craft your calendar with flexible locations and schedules for many roles&lt;\/li&gt;&lt;li&gt;Generous number of vacation days each year&lt;\/li&gt;&lt;li&gt;Increase your impact - We match up to $2000 (or local currency equivalent) for financial donations and service&lt;\/li&gt;&lt;li&gt;Up to 40 hours each year to use toward volunteer projects you love&lt;\/li&gt;&lt;li&gt;Embracing parenthood with a minimum of 16 weeks of parental leave&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;Different people approach problems differently. We need that. Elastic is an equal opportunity employer and is committed to creating an inclusive culture that celebrates different perspectives, experiences, and backgrounds. Qualified applicants will receive consideration for employment without regard to race, ethnicity, color, religion, sex, pregnancy, sexual orientation, gender perception or identity, national origin, age, marital status, protected veteran status, disability status, or any other basis protected by federal, state or local law, ordinance or regulation.&lt;\/p&gt;&lt;p&gt;We welcome individuals with disabilities and strive to create an accessible and inclusive experience for all individuals. To request an accommodation during the application or the recruiting process, please email &lt;a href=\&quot;mailto:candidate_accessibility@elastic.co\&quot;&gt;candidate_accessibility@elastic.co&lt;\/a&gt;. We will reply to your request within 24 business hours of submission.&lt;\/p&gt;&lt;p&gt;Applicants have rights under Federal Employment Laws and can view the following posters linked below:&lt;\/p&gt;&lt;p&gt;&lt;a href=\&quot;https:\/\/www.dol.gov\/sites\/dolgov\/files\/WHD\/legacy\/files\/fmlaen.pdf\&quot;&gt;Family and Medical Leave Act (FMLA) Poster&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;a href=\&quot;https:\/\/www.dol.gov\/sites\/dolgov\/files\/WHD\/legacy\/files\/eppabw.pdf\&quot;&gt;Employee Polygraph Protection Act (EPPA) Poster&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;Elasticsearch develops and distributes technology and information that is subject to U.S. and other countries\u2019 export controls and licensing requirements for individuals who are located in or are nationals of the following sanctioned countries and regions: Belarus, Cuba, Iran, North Korea, Syria, or Russia, including the Ukrainian territories annexed by Russia (The Crimea region of Ukraine, The Donetsk People&#039;s Republic (DNR), The Luhansk People&#039;s Republic (LNR), Kherson or Zaporizhzhia). If you are located in or are a national of one of the listed countries or regions, an export license may be required as a condition of your employment in this role. Please note that national origin and\/or nationality do not affect eligibility for employment with Elastic.&lt;\/p&gt;&lt;p&gt;Please see &lt;a href=\&quot;https:\/\/www.elastic.co\/legal\/applicant-privacy-statement\&quot;&gt;here&lt;\/a&gt; for our Privacy Statement.&lt;\/p&gt;&lt;p&gt;Compensation for this role is in the form of base salary plus a variable component, that together comprise the On-Target Earnings (OTE). On-Target Earnings (OTE) are based on a 75\/25 pay mix (base salary \/ target variable).&lt;\/p&gt;&lt;p&gt;The typical starting OTE range for new hires in this role is listed below. This range represents the lowest to highest OTE we reasonably and in good faith believe we would pay for this role at the time of this posting. We may ultimately pay more or less than the posted range, and the range may be modified in the future.&lt;\/p&gt;&lt;p&gt;An employee&#039;s position within the OTE range will be based on several factors including, but not limited to, relevant education, qualifications, certifications, experience, skills, geographic location, performance, and business or organizational needs.&lt;\/p&gt;&lt;p&gt;Elastic believes that employees should have the opportunity to share in the value that we create together for our shareholders. Therefore, in addition to cash compensation, this role is currently eligible to participate in Elastic&#039;s stock program. Our total rewards package also includes a company-matched 401k with dollar-for-dollar matching up to 6% of eligible earnings, along with a range of other benefits offered with a holistic emphasis on employee well-being.&lt;\/p&gt;&lt;p&gt;The typical starting salary range for this role is:&lt;\/p&gt;&lt;p&gt;$138,200\u2014$218,600 USD&lt;\/p&gt;&lt;p&gt;The typical starting Target Variable range for this role is:&lt;\/p&gt;&lt;p&gt;$46,000\u2014$72,800 USD&lt;\/p&gt;&lt;p&gt;The typical starting On-Target Earnings (OTE) range for this role is:&lt;\/p&gt;&lt;p&gt;$184,200\u2014$291,400 USD&lt;\/p&gt;&quot;,&quot;url_params&quot;:&quot;?gh_jid=8111876&quot;,&quot;preserved_params&quot;:{&quot;gh_jid&quot;:&quot;8111876&quot;},&quot;gh_jid&quot;:&quot;8111876&quot;,&quot;templateJobContent&quot;:[{&quot;id&quot;:33277142,&quot;boilerplate_id&quot;:1138,&quot;boilerplate_entry_id&quot;:33277142,&quot;title&quot;:&quot;Company Description&quot;,&quot;content&quot;:&quot;&lt;p&gt;Elastic, the Search AI Company, enables everyone to find the answers they need in real time, using all their data, at scale \u2014 unleashing the potential of businesses and people. The Elastic Search AI Platform, used by more than 50% of the Fortune 500, brings together the precision of search and the intelligence of AI to enable everyone to accelerate the results that matter. By taking advantage of all structured and unstructured data \u2014 securing and protecting private information more effectively \u2014 Elastic\u2019s complete, cloud-based solutions for search, security, and observability help organizations deliver on the promise of AI.&lt;\/p&gt;&quot;,&quot;ai_prompt&quot;:&quot;Include all content from sections titled (or containing the following information):\n\n- About Elastic\n- Why Elastic?\n\nParagraphs starting with \&quot;Elastic is a free and open search company...\&quot;&quot;,&quot;ai_content_default&quot;:0,&quot;ordinal&quot;:0,&quot;scored&quot;:1,&quot;locked&quot;:1,&quot;include_title&quot;:0,&quot;exportable&quot;:1,&quot;template_id&quot;:139,&quot;template_name&quot;:&quot;Elastic Default&quot;,&quot;jid&quot;:3818320,&quot;has_rulesets&quot;:false,&quot;matched_ruleset&quot;:false,&quot;rulesets&quot;:[]},{&quot;id&quot;:33277143,&quot;boilerplate_id&quot;:1137,&quot;boilerplate_entry_id&quot;:33277143,&quot;title&quot;:&quot;What is The Role:&quot;,&quot;content&quot;:&quot;&lt;p&gt;Elastic is seeking a &lt;b&gt;Principal Partner Value Engineer&lt;\/b&gt; to drive the economic blueprint of our strategic ecosystem. In this role, you will sit at the critical intersection of Elastic, our strategic Partners, and the ultimate End Customer. Your mission is two-fold: articulate and maximize &lt;b&gt;Elastic\u2019s value proposition to our partners&lt;\/b&gt;, and co-create the &lt;b&gt;partners&#039; unified value proposition to the market&lt;\/b&gt;.&lt;\/p&gt;&lt;p&gt;We are looking for a high-impact professional with a deep background in partner ecosystems, a proven track record of value-based selling, and established partner relationships. This is a &lt;b&gt;fully remote role&lt;\/b&gt; open to candidates based in &lt;b&gt;AMER&lt;\/b&gt;. If you excel in dynamic environments, love building scalable frameworks, and are ready to be a change agent within a high-performing global team, we want to hear from you.&lt;\/p&gt;&quot;,&quot;ai_prompt&quot;:&quot;Include all content from sections titled (or containing the following information):\n\n- Role Overview\n- About The Role\n- In your role\n- Any section about the role or candidate\n- About The Team\n- Why this team?\n- Our Team Style\n- Some of the things you&#039;ll work on\n- What You Will Be Learning\n- Information about location or applicant requirements (e.g., \&quot;Location\&quot;, \&quot;Location and Travel\&quot;, \&quot;Applicant must be a US citizen\&quot;)\n- Descriptions similar to \&quot;We are looking for a dynamic [position name] to join our [team name] team...\&quot;, \&quot;The [team name] team sits in [position name]....\&quot;, \&quot;We are hunting for a [position name] to...\&quot;&quot;,&quot;ai_content_default&quot;:0,&quot;ordinal&quot;:1,&quot;scored&quot;:1,&quot;locked&quot;:0,&quot;include_title&quot;:1,&quot;exportable&quot;:1,&quot;template_id&quot;:139,&quot;template_name&quot;:&quot;Elastic Default&quot;,&quot;jid&quot;:3818320,&quot;has_rulesets&quot;:false,&quot;matched_ruleset&quot;:false,&quot;rulesets&quot;:[]},{&quot;id&quot;:33277144,&quot;boilerplate_id&quot;:1144,&quot;boilerplate_entry_id&quot;:33277144,&quot;title&quot;:&quot;Unmatched Content&quot;,&quot;content&quot;:&quot;&quot;,&quot;ai_prompt&quot;:&quot;&quot;,&quot;ai_content_default&quot;:0,&quot;ordinal&quot;:2,&quot;scored&quot;:1,&quot;locked&quot;:0,&quot;include_title&quot;:0,&quot;exportable&quot;:1,&quot;template_id&quot;:139,&quot;template_name&quot;:&quot;Elastic Default&quot;,&quot;jid&quot;:3818320,&quot;has_rulesets&quot;:false,&quot;matched_ruleset&quot;:false,&quot;rulesets&quot;:[]},{&quot;id&quot;:33277145,&quot;boilerplate_id&quot;:1139,&quot;boilerplate_entry_id&quot;:33277145,&quot;title&quot;:&quot;What You Will Be Doing:&quot;,&quot;content&quot;:&quot;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Dual-Value Architecture:&lt;\/b&gt; Co-develop and articulate the joint \&quot;Elastic + Partner\&quot; value proposition. Help partners understand the ROI of building on or with Elastic, while simultaneously helping partners position that combined value to their end customers.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Ecosystem Collaboration:&lt;\/b&gt; Partner closely with Global Alliances, Channel Sales leaders, and partner account teams to identify, prioritize, and execute value delivery strategies for key regional and global partners.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Business Case and ROI Development:&lt;\/b&gt; Lead joint business value reviews and create boardroom-quality business cases that quantify the economic benefits, total cost of ownership (TCO), and realized business impacts of Elastic-powered partner solutions.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Framework and Tool Creation:&lt;\/b&gt; Help scale the Partner Value Engineering practice by creating repeatable frameworks, tools, and value calculators tailored specifically to different partner personas such as GSIs, MSSPs, and Cloud Hyperscalers.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Executive Presentation:&lt;\/b&gt; Deliver compelling, high-impact presentations to partner executives and joint customers, acting as a trusted advisor on business transformation and optimization.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Cross-Functional Alignment:&lt;\/b&gt; Work collaboratively with Product, Marketing, and Engineering teams to ensure partner feedback and unique ecosystem use cases are integrated into Elastic\u2019s broader value strategy.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Enablement and Workshops:&lt;\/b&gt; Conduct training sessions and workshops for both internal Elastic teams and partner organizations to elevate their discovery capabilities and understanding of value-based selling.&lt;\/li&gt;&lt;\/ul&gt;&quot;,&quot;ai_prompt&quot;:&quot;Include content from sections titled or containing:\n\n- Responsibilities\n- Key Responsibilities\n- Core Responsibilities\n- Key Functional Areas\n- What You Will Be Doing\n- What You&#039;ll Do\n- You Will\n- In this role, you will\n- Your key tasks will include\n\n*Preserve bullet points and do not use dashes&quot;,&quot;ai_content_default&quot;:0,&quot;ordinal&quot;:3,&quot;scored&quot;:1,&quot;locked&quot;:0,&quot;include_title&quot;:1,&quot;exportable&quot;:1,&quot;template_id&quot;:139,&quot;template_name&quot;:&quot;Elastic Default&quot;,&quot;jid&quot;:3818320,&quot;has_rulesets&quot;:false,&quot;matched_ruleset&quot;:false,&quot;rulesets&quot;:[]},{&quot;id&quot;:33277146,&quot;boilerplate_id&quot;:1140,&quot;boilerplate_entry_id&quot;:33277146,&quot;title&quot;:&quot;What You Bring:&quot;,&quot;content&quot;:&quot;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Experience:&lt;\/b&gt; 4+ years of experience in Value Engineering, Management Consulting, Partner Enablement, or a related customer or partner-facing strategic role.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Partner DNA:&lt;\/b&gt; Proven experience working directly within or alongside &lt;b&gt;partner ecosystems&lt;\/b&gt; (GSIs, RSIs, MSPs, or Cloud Providers) with a strong network of existing partner relationships.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Value Selling Expertise:&lt;\/b&gt; Expert-level knowledge of value-based selling methodologies (such as MEDDPICC, Challenger, or similar frameworks) and a demonstrated ability to build complex financial models and business cases.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Strategic and Analytical Skills:&lt;\/b&gt; Strong analytical, financial acumen, and problem-solving skills. Ability to navigate ambiguity, project manage multiple workstreams, and act decisively under minimal supervision.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Communication Mastery:&lt;\/b&gt; Exceptional communication and storytelling skills, with a track record of influencing C-level executives and partner principals.&lt;\/li&gt;&lt;li&gt;&lt;b&gt;Location and Travel:&lt;\/b&gt; Remote, based in &lt;b&gt;North America&lt;\/b&gt;. Willingness to travel as needed to meet with partners and account teams within your region.&lt;\/li&gt;&lt;\/ul&gt;&quot;,&quot;ai_prompt&quot;:&quot;Include content from sections titled or containing:\n\n- Qualifications\n- Required Qualifications\n- Preferred Qualifications\n- Skills\n- Capabilities and Experience\n- Sections beginning with \&quot;Experience...\&quot;\n- Sections beginning with \&quot;Knowledge...\&quot;\n- Sections beginning with \&quot;Proficiency and Education...\&quot;\n- Sections beginning with \&quot;Skills...\&quot;\n- What We Are Looking For\n- What You Bring\n- What You&#039;ll Need To Be Successful\n\nExclude sections starting with \&quot;If that&#039;s you, hopefully you also have\&quot;\n\n- Preserve bullet points and do not use dashes&quot;,&quot;ai_content_default&quot;:0,&quot;ordinal&quot;:4,&quot;scored&quot;:1,&quot;locked&quot;:0,&quot;include_title&quot;:1,&quot;exportable&quot;:1,&quot;template_id&quot;:139,&quot;template_name&quot;:&quot;Elastic Default&quot;,&quot;jid&quot;:3818320,&quot;has_rulesets&quot;:false,&quot;matched_ruleset&quot;:false,&quot;rulesets&quot;:[]},{&quot;id&quot;:33277147,&quot;boilerplate_id&quot;:1141,&quot;boilerplate_entry_id&quot;:33277147,&quot;title&quot;:&quot;Bonus Points:&quot;,&quot;content&quot;:&quot;&quot;,&quot;ai_prompt&quot;:&quot;Include content from sections titled or containing:\n\n- Bonus Points\n- Nice to Have\n- Additional or Preferred Qualifications\n- Bonus Skills\n- \&quot;If that&#039;s you, hopefully you also have...\&quot;\n- \&quot;If you&#039;re driven to build your own pipeline, master complex deal cycles, and help customers unlock the power of Search AI, we&#039;d love to talk. Apply today! \&quot;\n- If you&#039;re eager to contribute to the world of Search Analytics and thrive in solving complex problems through the power of AI-driven search, Elastic wants to hear from you!\n- Preserve bullet points and do not use dashes&quot;,&quot;ai_content_default&quot;:0,&quot;ordinal&quot;:5,&quot;scored&quot;:1,&quot;locked&quot;:0,&quot;include_title&quot;:1,&quot;exportable&quot;:1,&quot;template_id&quot;:139,&quot;template_name&quot;:&quot;Elastic Default&quot;,&quot;jid&quot;:3818320,&quot;has_rulesets&quot;:false,&quot;matched_ruleset&quot;:false,&quot;rulesets&quot;:[]},{&quot;id&quot;:33277148,&quot;boilerplate_id&quot;:1142,&quot;boilerplate_entry_id&quot;:33277148,&quot;title&quot;:&quot;Additional Information - We Take Care of Our People:&quot;,&quot;content&quot;:&quot;&lt;p&gt;As a distributed company, diversity drives our identity. Whether you\u2019re looking to launch a new career or grow an existing one, Elastic is the type of company where you can balance great work with great life. Your age is only a number. It doesn\u2019t matter if you\u2019re just out of college or your children are; we need you for what you can do.&lt;\/p&gt;&lt;p&gt;We strive to have parity of benefits across regions, and while regulations differ from place to place, we believe taking care of our people is the right thing to do.&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;Competitive pay based on the work you do here and not your previous salary&lt;\/li&gt;&lt;li&gt;Health coverage for you and your family in many locations&lt;\/li&gt;&lt;li&gt;Ability to craft your calendar with flexible locations and schedules for many roles&lt;\/li&gt;&lt;li&gt;Generous number of vacation days each year&lt;\/li&gt;&lt;li&gt;Increase your impact - We match up to $2000 (or local currency equivalent) for financial donations and service&lt;\/li&gt;&lt;li&gt;Up to 40 hours each year to use toward volunteer projects you love&lt;\/li&gt;&lt;li&gt;Embracing parenthood with a minimum of 16 weeks of parental leave&lt;\/li&gt;&lt;\/ul&gt;&quot;,&quot;ai_prompt&quot;:&quot;Include company benefits and any other content for sections titled or containing:\n\n- We Take Care of Our People\n- Additional Information&quot;,&quot;ai_content_default&quot;:0,&quot;ordinal&quot;:6,&quot;scored&quot;:1,&quot;locked&quot;:1,&quot;include_title&quot;:1,&quot;exportable&quot;:1,&quot;template_id&quot;:139,&quot;template_name&quot;:&quot;Elastic Default&quot;,&quot;jid&quot;:3818320,&quot;has_rulesets&quot;:true,&quot;matched_ruleset&quot;:false,&quot;rulesets&quot;:[{&quot;id&quot;:63,&quot;boilerplate_id&quot;:1142,&quot;ordinal&quot;:0,&quot;logic&quot;:&quot;AND&quot;,&quot;content&quot;:&quot;&lt;p&gt;As a distributed company, diversity drives our identity. Whether you\u2019re looking to launch a new career or grow an existing one, Elastic is the type of company where you can balance great work with great life. Your age is only a number. It doesn\u2019t matter if you\u2019re just out of college or your children are; we need you for what you can do.&lt;\/p&gt;&lt;p&gt;&lt;\/p&gt;&lt;p&gt;We strive to have parity of benefits across regions, and while regulations differ from place to place, we believe taking care of our people is the right thing to do.&lt;\/p&gt;&lt;p&gt;&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;Competitive pay based on the work you do here and not your previous salary&lt;\/li&gt;&lt;li&gt;Health coverage for you and your family in many locations&lt;\/li&gt;&lt;li&gt;Ability to craft your calendar with flexible locations and schedules for many roles&lt;\/li&gt;&lt;li&gt;Generous number of vacation days each year&lt;\/li&gt;&lt;li&gt;Increase your impact - We match up to $2000 (or local currency equivalent) for financial donations and service&lt;\/li&gt;&lt;li&gt;Up to 40 hours each year to use toward volunteer projects you love&lt;\/li&gt;&lt;li&gt;Embracing parenthood with a minimum of 16 weeks of parental leave&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;\/p&gt;&lt;p&gt;&lt;strong&gt;Security &amp;amp; Privacy Responsibilities: &lt;\/strong&gt;Take ownership of protecting the confidentiality, integrity, and availability of organizational data and systems by following applicable privacy and security policies, standards, and procedures. Ensure that all individual contributions follow Elastic\u2019s Secure Software Development Framework (SSDF). Proactively participate in mandatory role-based training to ensure personal technical execution consistently aligns with the highest standards of data protection, data privacy, and system resilience.&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-03-31T17:23:37.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-03-31T17:29:24.000000Z&quot;,&quot;rules&quot;:[{&quot;id&quot;:70,&quot;ruleset_id&quot;:63,&quot;facet&quot;:&quot;category&quot;,&quot;operator&quot;:&quot;==&quot;,&quot;value&quot;:&quot;Engineering&quot;,&quot;created_at&quot;:&quot;2026-03-31T17:23:38.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-03-31T17:23:38.000000Z&quot;}]}]},{&quot;id&quot;:33277149,&quot;boilerplate_id&quot;:1145,&quot;boilerplate_entry_id&quot;:33277149,&quot;title&quot;:&quot;Diversity Statement&quot;,&quot;content&quot;:&quot;&lt;p&gt;Different people approach problems differently. We need that. Elastic is an equal opportunity employer and is committed to creating an inclusive culture that celebrates different perspectives, experiences, and backgrounds. Qualified applicants will receive consideration for employment without regard to race, ethnicity, color, religion, sex, pregnancy, sexual orientation, gender perception or identity, national origin, age, marital status, protected veteran status, disability status, or any other basis protected by federal, state or local law, ordinance or regulation.&lt;\/p&gt;&lt;p&gt;We welcome individuals with disabilities and strive to create an accessible and inclusive experience for all individuals. To request an accommodation during the application or the recruiting process, please email &lt;a href=\&quot;mailto:candidate_accessibility@elastic.co\&quot;&gt;candidate_accessibility@elastic.co&lt;\/a&gt;. We will reply to your request within 24 business hours of submission.&lt;\/p&gt;&quot;,&quot;ai_prompt&quot;:&quot;Include any content pertaining to diversity and support for individuals with disabilities.&quot;,&quot;ai_content_default&quot;:0,&quot;ordinal&quot;:7,&quot;scored&quot;:1,&quot;locked&quot;:1,&quot;include_title&quot;:0,&quot;exportable&quot;:1,&quot;template_id&quot;:139,&quot;template_name&quot;:&quot;Elastic Default&quot;,&quot;jid&quot;:3818320,&quot;has_rulesets&quot;:false,&quot;matched_ruleset&quot;:false,&quot;rulesets&quot;:[]},{&quot;id&quot;:33277150,&quot;boilerplate_id&quot;:1146,&quot;boilerplate_entry_id&quot;:33277150,&quot;title&quot;:&quot;EEO and Privacy\/Disclosure Statements&quot;,&quot;content&quot;:&quot;&lt;p&gt;Applicants have rights under Federal Employment Laws and can view the following posters linked below:&lt;\/p&gt;&lt;p&gt;&lt;a href=\&quot;https:\/\/www.dol.gov\/sites\/dolgov\/files\/WHD\/legacy\/files\/fmlaen.pdf\&quot;&gt;Family and Medical Leave Act (FMLA) Poster&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;&lt;a href=\&quot;https:\/\/www.dol.gov\/sites\/dolgov\/files\/WHD\/legacy\/files\/eppabw.pdf\&quot;&gt;Employee Polygraph Protection Act (EPPA) Poster&lt;\/a&gt;&lt;\/p&gt;&lt;p&gt;Elasticsearch develops and distributes technology and information that is subject to U.S. and other countries\u2019 export controls and licensing requirements for individuals who are located in or are nationals of the following sanctioned countries and regions: Belarus, Cuba, Iran, North Korea, Syria, or Russia, including the Ukrainian territories annexed by Russia (The Crimea region of Ukraine, The Donetsk People&#039;s Republic (DNR), The Luhansk People&#039;s Republic (LNR), Kherson or Zaporizhzhia). If you are located in or are a national of one of the listed countries or regions, an export license may be required as a condition of your employment in this role. Please note that national origin and\/or nationality do not affect eligibility for employment with Elastic.&lt;\/p&gt;&lt;p&gt;Please see &lt;a href=\&quot;https:\/\/www.elastic.co\/legal\/applicant-privacy-statement\&quot;&gt;here&lt;\/a&gt; for our Privacy Statement.&lt;\/p&gt;&quot;,&quot;ai_prompt&quot;:&quot;Include all compliance and legal disclosure statements.&quot;,&quot;ai_content_default&quot;:0,&quot;ordinal&quot;:8,&quot;scored&quot;:1,&quot;locked&quot;:1,&quot;include_title&quot;:0,&quot;exportable&quot;:1,&quot;template_id&quot;:139,&quot;template_name&quot;:&quot;Elastic Default&quot;,&quot;jid&quot;:3818320,&quot;has_rulesets&quot;:false,&quot;matched_ruleset&quot;:false,&quot;rulesets&quot;:[]},{&quot;id&quot;:33277151,&quot;boilerplate_id&quot;:1143,&quot;boilerplate_entry_id&quot;:33277151,&quot;title&quot;:&quot;Salary Information&quot;,&quot;content&quot;:&quot;&lt;p&gt;Compensation for this role is in the form of base salary plus a variable component, that together comprise the On-Target Earnings (OTE). On-Target Earnings (OTE) are based on a 75\/25 pay mix (base salary \/ target variable).&lt;\/p&gt;&lt;p&gt;The typical starting OTE range for new hires in this role is listed below. This range represents the lowest to highest OTE we reasonably and in good faith believe we would pay for this role at the time of this posting. We may ultimately pay more or less than the posted range, and the range may be modified in the future.&lt;\/p&gt;&lt;p&gt;An employee&#039;s position within the OTE range will be based on several factors including, but not limited to, relevant education, qualifications, certifications, experience, skills, geographic location, performance, and business or organizational needs.&lt;\/p&gt;&lt;p&gt;Elastic believes that employees should have the opportunity to share in the value that we create together for our shareholders. Therefore, in addition to cash compensation, this role is currently eligible to participate in Elastic&#039;s stock program. Our total rewards package also includes a company-matched 401k with dollar-for-dollar matching up to 6% of eligible earnings, along with a range of other benefits offered with a holistic emphasis on employee well-being.&lt;\/p&gt;&lt;p&gt;The typical starting salary range for this role is:&lt;\/p&gt;&lt;p&gt;$138,200\u2014$218,600 USD&lt;\/p&gt;&lt;p&gt;The typical starting Target Variable range for this role is:&lt;\/p&gt;&lt;p&gt;$46,000\u2014$72,800 USD&lt;\/p&gt;&lt;p&gt;The typical starting On-Target Earnings (OTE) range for this role is:&lt;\/p&gt;&lt;p&gt;$184,200\u2014$291,400 USD&lt;\/p&gt;&quot;,&quot;ai_prompt&quot;:&quot;Include any content related to salary, wages, 401k, or payment from sections titled:\n\n- Salary\n- Wages\n- Salary Range\n- Compensation details\n- 401k details&quot;,&quot;ai_content_default&quot;:0,&quot;ordinal&quot;:9,&quot;scored&quot;:1,&quot;locked&quot;:0,&quot;include_title&quot;:0,&quot;exportable&quot;:1,&quot;template_id&quot;:139,&quot;template_name&quot;:&quot;Elastic Default&quot;,&quot;jid&quot;:3818320,&quot;has_rulesets&quot;:false,&quot;matched_ruleset&quot;:false,&quot;rulesets&quot;:[]},{&quot;id&quot;:33277152,&quot;boilerplate_id&quot;:1152,&quot;boilerplate_entry_id&quot;:33277152,&quot;title&quot;:&quot;Job Code&quot;,&quot;content&quot;:&quot;&quot;,&quot;ai_prompt&quot;:&quot;Include any codes in the format: #XX-XXX (or similar codes that start with #)&quot;,&quot;ai_content_default&quot;:0,&quot;ordinal&quot;:10,&quot;scored&quot;:1,&quot;locked&quot;:0,&quot;include_title&quot;:0,&quot;exportable&quot;:1,&quot;template_id&quot;:139,&quot;template_name&quot;:&quot;Elastic Default&quot;,&qu
